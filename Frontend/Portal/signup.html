<!DOCTYPE html>
<html>

<head>

<title>Sign Up</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="form-container">

<h2>Create Account</h2>b

<form id="signupForm">
    <div class="input-group">
        <label>Full Name</label>
        <input type="text" id="fullName" placeholder="Enter your full name" required>
    </div>
    <div class="input-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required>
    </div>
    <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Create a password" required>
    </div>
    <button type="submit" class="btn">Sign Up</button>
</form>

<input type="text" placeholder="Full Name" required>

<input type="email" placeholder="Email" required>

<input type="password" placeholder="Password" required>

<button type="submit">Create Account</button>

</form>

<p>Already have an account? <a href="login.html">Login</a></p>

</div>

<script src="js/script.js"></script>
<script>
    const signupForm = document.getElementById('signupForm');

    signupForm.addEventListener('submit', async (e) => {
        e.preventDefault(); // Prevents the page from refreshing

        // 1. Collect the data from the form
        const studentData = {
            full_name: document.getElementById('fullName').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        };

        try {
            // 2. Send the data to your Node.js API
            const response = await fetch('http://localhost:5000/api/auth/signup', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(studentData)
            });

            const result = await response.json();

            // 3. Handle the response
            if (response.ok) {
                alert('Account created successfully! Welcome to the platform.');
                window.location.href = 'login.html'; // Redirect to login page
            } else {
                alert('Error: ' + result.message);
            }
        } catch (error) {
            console.error('Fetch error:', error);
            alert('Server is not responding. Is the backend running?');
        }
    });
</script>

</body>

</html>
