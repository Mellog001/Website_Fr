<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — EduConnect</title>
<link rel="stylesheet" href="CSS/style.css">
</head>
<body>

<div class="form-container">
  <h2>Create Account</h2>

  <p class="form-error" id="formError" hidden></p>

  <form id="signupForm">
    <div class="input-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="you@example.com" required>
    </div>
    <div class="input-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="At least 8 characters" required minlength="8">
      <small>Must include an uppercase letter, a lowercase letter, and a number.</small>
    </div>
    <div class="input-group">
      <label for="role">I am a</label>
      <select id="role" required>
        <option value="STUDENT">Student</option>
        <option value="TUTOR">Tutor</option>
      </select>
    </div>
    <button type="submit" class="btn" id="submitBtn">Sign Up</button>
  </form>

  <p>Already have an account? <a href="login.html">Login</a></p>
</div>

<script src="js/api.js"></script>
<script>
  const form = document.getElementById("signupForm");
  const errorEl = document.getElementById("formError");
  const submitBtn = document.getElementById("submitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.hidden = true;
    submitBtn.disabled = true;
    submitBtn.textContent = "Creating account...";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const role = document.getElementById("role").value;

    const result = await Api.register(email, password, role);

    submitBtn.disabled = false;
    submitBtn.textContent = "Sign Up";

    if (!result || !result.ok) {
      const detail = result && result.details && result.details[0] && result.details[0].message;
      errorEl.textContent = detail || (result && result.message) || "Couldn't connect to the server.";
      errorEl.hidden = false;
      return;
    }

    Auth.setSession({
      accessToken: result.data.accessToken,
      refreshToken: result.data.refreshToken,
      user: result.data.user,
    });

    window.location.href = "dashboard.html";
  });
</script>

</body>
</html>
