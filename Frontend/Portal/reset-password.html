<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — EduConnect</title>
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

<header>
  <h2>EduConnect</h2>
</header>

<main style="max-width: 420px; margin: 3rem auto; padding: 0 1rem;">

  <h3>Reset your password</h3>
  <p>Enter your new password below.</p>

  <p class="form-error" id="formError" hidden></p>
  <p class="form-success" id="formSuccess" hidden></p>

  <form id="resetForm">
    <div class="input-group">
      <label for="newPassword">New Password</label>
      <input type="password" id="newPassword" placeholder="Enter new password" required>
      <small>Must include an uppercase letter, a lowercase letter, and a number.</small>
    </div>

    <div class="input-group">
      <label for="confirmPassword">Confirm New Password</label>
      <input type="password" id="confirmPassword" placeholder="Re-enter new password" required>
    </div>

    <button type="submit" class="btn" id="submitBtn">Reset Password</button>
  </form>

  <p style="margin-top: 1.5rem;">
    <a href="login.html">Back to Login</a>
  </p>

</main>

<script src="js/api.js"></script>
<script>
  const form = document.getElementById("resetForm");
  const errorEl = document.getElementById("formError");
  const successEl = document.getElementById("formSuccess");
  const submitBtn = document.getElementById("submitBtn");

  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get("token");

  if (!token) {
    errorEl.textContent = "Invalid or missing reset link. Please request a new one.";
    errorEl.hidden = false;
    form.querySelectorAll("input, button").forEach(el => el.disabled = true);
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    errorEl.hidden = true;
    successEl.hidden = true;

    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (newPassword !== confirmPassword) {
      errorEl.textContent = "Passwords do not match.";
      errorEl.hidden = false;
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Resetting...";

    try {
      const result = await Api.resetPassword(token, newPassword);

      if (!result || !result.ok) {
        errorEl.textContent = (result && result.message) || "Failed to reset password. The link may have expired.";
        errorEl.hidden = false;
        return;
      }

      successEl.textContent = "Password reset successfully! Redirecting to login...";
      successEl.hidden = false;
      form.reset();

      setTimeout(() => {
        window.location.href = "login.html";
      }, 2000);

    } catch (error) {
      console.error("Reset password error:", error);
      errorEl.textContent = "Something went wrong. Please try again.";
      errorEl.hidden = false;
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Reset Password";
    }
  });
</script>

</body>
</html>
