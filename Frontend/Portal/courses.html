<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Courses — EduConnect</title>
<link rel="stylesheet" href="CSS/style.css">
</head>
<body>

<header>
  <h2>Courses</h2>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="profile.html">Profile</a>
    <a href="#" id="logoutLink">Logout</a>
  </nav>
</header>

<section class="course-list" id="courseList">
  <p>Loading courses...</p>
</section>

<!-- Enrollment modal: collects the M-Pesa phone number before triggering STK push -->
<div class="modal-backdrop" id="enrollModal" hidden>
  <div class="modal">
    <h3 id="modalCourseTitle">Enroll</h3>
    <p class="modal-price" id="modalCoursePrice"></p>
    <p class="form-error" id="modalError" hidden></p>
    <p class="modal-status" id="modalStatus" hidden></p>

    <div class="input-group">
      <label for="phoneNumber">M-Pesa phone number</label>
      <input type="tel" id="phoneNumber" placeholder="07XXXXXXXX">
    </div>
    <button class="btn" id="payBtn">Pay with M-Pesa</button>
    <button class="btn-secondary" id="cancelBtn">Cancel</button>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  requireAuth();

  const courseList = document.getElementById("courseList");
  const modal = document.getElementById("enrollModal");
  const modalCourseTitle = document.getElementById("modalCourseTitle");
  const modalCoursePrice = document.getElementById("modalCoursePrice");
  const modalError = document.getElementById("modalError");
  const modalStatus = document.getElementById("modalStatus");
  const phoneInput = document.getElementById("phoneNumber");
  const payBtn = document.getElementById("payBtn");
  const cancelBtn = document.getElementById("cancelBtn");

  let activeCourse = null;
  let pollTimer = null;

  document.getElementById("logoutLink").addEventListener("click", async (e) => {
    e.preventDefault();
    await Api.logout();
    window.location.href = "login.html";
  });

  function formatKES(amount) {
    return new Intl.NumberFormat("en-KE", { style: "currency", currency: "KES", maximumFractionDigits: 0 }).format(amount);
  }

  function renderCourses(courses) {
    if (courses.length === 0) {
      courseList.innerHTML = "<p>No courses available yet.</p>";
      return;
    }
    courseList.innerHTML = "";
    courses.forEach((course) => {
      const el = document.createElement("div");
      el.className = "course";
      el.innerHTML = `
        <h3>${course.title}</h3>
        <p class="course-subject">${course.subject?.name || "General"}</p>
        <p>${course.description || ""}</p>
        <p class="course-price">${formatKES(course.price)}</p>
        <button data-course-id="${course.id}" data-title="${course.title}" data-price="${course.price}">Enroll</button>
      `;
      courseList.appendChild(el);
    });

    courseList.querySelectorAll("button[data-course-id]").forEach((btn) => {
      btn.addEventListener("click", () => openEnrollModal(btn.dataset.courseId, btn.dataset.title, btn.dataset.price));
    });
  }

  async function loadCatalog() {
    const result = await Api.getCatalog();
    if (!result || !result.ok) {
      courseList.innerHTML = `<p class="form-error">${(result && result.message) || "Couldn't load courses."}</p>`;
      return;
    }
    renderCourses(result.data.courses);
  }

  function openEnrollModal(courseId, title, price) {
    activeCourse = courseId;
    modalCourseTitle.textContent = title;
    modalCoursePrice.textContent = formatKES(price);
    modalError.hidden = true;
    modalStatus.hidden = true;
    phoneInput.value = "";
    payBtn.disabled = false;
    payBtn.textContent = "Pay with M-Pesa";
    modal.hidden = false;
  }

  function closeModal() {
    modal.hidden = true;
    activeCourse = null;
    if (pollTimer) clearInterval(pollTimer);
  }

  cancelBtn.addEventListener("click", closeModal);

  payBtn.addEventListener("click", async () => {
    modalError.hidden = true;
    const phoneNumber = phoneInput.value.trim();

    if (!/^(?:254|\+254|0)?(7|1)([0-9]{8})$/.test(phoneNumber)) {
      modalError.textContent = "Enter a valid Kenyan phone number, e.g. 0712345678.";
      modalError.hidden = false;
      return;
    }

    payBtn.disabled = true;
    payBtn.textContent = "Sending request...";

    const result = await Api.initiateStkPush(activeCourse, phoneNumber);

    if (!result || !result.ok) {
      modalError.textContent = (result && result.message) || "Couldn't start the payment.";
      modalError.hidden = false;
      payBtn.disabled = false;
      payBtn.textContent = "Pay with M-Pesa";
      return;
    }

    payBtn.textContent = "Waiting for payment...";
    modalStatus.textContent = "Enter your M-Pesa PIN on your phone to complete enrollment.";
    modalStatus.hidden = false;

    // No dedicated payment-status endpoint exists yet — we poll the course
    // details response, which flips isEnrolled to true once the M-Pesa
    // callback has been processed on the backend.
    const courseId = activeCourse;
    let attempts = 0;
    pollTimer = setInterval(async () => {
      attempts += 1;
      const details = await Api.getCourseDetails(courseId);
      if (details && details.ok && details.data.isEnrolled) {
        clearInterval(pollTimer);
        modalStatus.textContent = "Enrollment confirmed! Redirecting to your dashboard...";
        setTimeout(() => (window.location.href = "dashboard.html"), 1200);
      } else if (attempts >= 20) {
        clearInterval(pollTimer);
        modalStatus.textContent = "Still waiting on confirmation. Check your dashboard shortly.";
      }
    }, 3000);
  });

  loadCatalog();
</script>

</body>
</html>
