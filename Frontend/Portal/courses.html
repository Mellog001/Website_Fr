<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courses — EduConnect</title>
  <link rel="stylesheet" href="CSS/style.css">
  <style>
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal {
      background: white;
      padding: 30px;
      border-radius: 10px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    }
    .modal h3 {
      margin-top: 0;
      color: #2c3e50;
    }
    .modal-price {
      font-size: 1.5rem;
      font-weight: bold;
      color: #27ae60;
      margin: 15px 0;
    }
    .modal-status {
      padding: 10px;
      border-radius: 5px;
      margin: 10px 0;
    }
    .modal-status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .modal-status.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .modal-actions .btn {
      flex: 1;
    }
    .modal-actions .btn-secondary {
      flex: 1;
      background: #6c757d;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
    }
    .modal-actions .btn-secondary:hover {
      background: #5a6268;
    }
    .course-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 15px;
      background: #f0f0f0;
    }
    .course-tutor {
      color: #7f8c8d;
      font-size: 0.9rem;
      margin: 5px 0;
    }
    .course-status {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      margin-top: 10px;
    }
    .status-enrolled {
      background: #c8e6c9;
      color: #2e7d32;
    }
    .status-pending {
      background: #ffe0b2;
      color: #e65100;
    }
    .enroll-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .course-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .course-actions .btn {
      flex: 1;
      min-width: 120px;
    }
    .btn-start-learning {
      background: #27ae60;
      color: white;
    }
    .btn-start-learning:hover {
      background: #219a52;
    }
    .btn-pending {
      background: #f39c12;
      color: white;
      cursor: not-allowed;
    }
    .btn-enrolled {
      background: #2ecc71;
      color: white;
    }
    .btn-enroll {
      background: #2196f3;
      color: white;
    }
    .btn-enroll:hover {
      background: #1976d2;
    }
  </style>
</head>
<body>

  <header>
    <h2 id="coursesTitle">Courses</h2>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="profile.html">Profile</a>
      <a href="#" id="logoutLink">Logout</a>
    </nav>
  </header>

  <section class="course-list" id="courseList">
    <p>Loading courses...</p>
  </section>

  <!-- Enrollment confirmation modal -->
  <div class="modal-backdrop" id="enrollModal" hidden>
    <div class="modal">
      <h3 id="modalCourseTitle">Confirm Enrollment</h3>
      <p class="modal-price" id="modalCoursePrice"></p>
      <p><strong>Course:</strong> <span id="modalCourseName"></span></p>
      <p><strong>Total Amount:</strong> <span id="modalTotalAmount"></span></p>
      
      <div id="modalStatus" class="modal-status info" hidden>
        Please confirm your enrollment. You will receive payment details via email.
      </div>
      
      <div id="modalError" class="form-error" hidden></div>
      <div id="modalSuccess" class="modal-status success" hidden>
        ✅ Enrollment request submitted! Check your email for payment instructions.
      </div>

      <div class="modal-actions">
        <button class="btn" id="confirmEnrollBtn">Confirm Enrollment</button>
        <button class="btn-secondary" id="cancelBtn">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/api.js?v=5"></script>
  <script>
    requireAuth();

    // ================================
    // CURRENT USER & ROLE
    // ================================

    const currentUser = Auth.getUser();
    const currentClaims = Auth.decodeAccessToken();
    const currentRole = currentUser?.role || currentClaims?.role || "STUDENT";

    // Set page title based on role
    if (currentRole === "TUTOR") {
      document.getElementById("coursesTitle").textContent = "My Courses";
    } else if (currentRole === "ADMIN") {
      document.getElementById("coursesTitle").textContent = "Course Management";
    } else {
      document.getElementById("coursesTitle").textContent = "Available Courses";
    }

    // ================================
    // ELEMENTS
    // ================================

    const courseList = document.getElementById("courseList");
    const modal = document.getElementById("enrollModal");
    const modalCourseTitle = document.getElementById("modalCourseTitle");
    const modalCourseName = document.getElementById("modalCourseName");
    const modalCoursePrice = document.getElementById("modalCoursePrice");
    const modalTotalAmount = document.getElementById("modalTotalAmount");
    const modalStatus = document.getElementById("modalStatus");
    const modalSuccess = document.getElementById("modalSuccess");
    const modalError = document.getElementById("modalError");
    const confirmBtn = document.getElementById("confirmEnrollBtn");
    const cancelBtn = document.getElementById("cancelBtn");

    let activeCourse = null;
    let activeCourseData = null;

    // ================================
    // LOGOUT
    // ================================

    document.getElementById("logoutLink").addEventListener("click", async (e) => {
      e.preventDefault();
      await Api.logout();
      window.location.href = "login.html";
    });

    // ================================
    // HELPERS
    // ================================

    function formatKES(amount) {
      return new Intl.NumberFormat("en-KE", {
        style: "currency",
        currency: "KES",
        maximumFractionDigits: 0
      }).format(amount);
    }

    function truncateText(text, maxLength = 100) {
      if (!text) return '';
      if (text.length <= maxLength) return text;
      return text.substring(0, maxLength) + '...';
    }

    // ================================
    // RENDER COURSES
    // ================================

    async function renderCourses(courses) {
      if (courses.length === 0) {
        courseList.innerHTML = "<p>No courses available yet.</p>";
        return;
      }

      courseList.innerHTML = "";

      for (const course of courses) {
        const el = document.createElement("div");
        el.className = "course";

        // Check enrollment status for this course if user is a student
        let enrollmentStatus = 'NOT_ENROLLED';
        
        if (currentRole === 'STUDENT') {
          try {
            const statusResult = await Api.getEnrollmentStatus(course.id);
            if (statusResult && statusResult.ok && statusResult.data) {
              const status = statusResult.data.status;
              if (status === 'ACTIVE' || status === 'COMPLETED') {
                enrollmentStatus = 'ENROLLED';
              } else if (status === 'PENDING') {
                enrollmentStatus = 'PENDING';
              }
            }
          } catch (error) {
            console.error('Error checking enrollment status:', error);
          }
        }

        // Determine button based on role and enrollment status
        let actionHtml = "";

        if (currentRole === "STUDENT") {
          if (enrollmentStatus === 'ENROLLED') {
            actionHtml = `
              <div class="course-actions">
                <button class="btn btn-start-learning" onclick="startLearning('${course.id}')">
                  🚀 Start Learning
                </button>
                <span class="course-status status-enrolled">✅ Enrolled</span>
              </div>
            `;
          } else if (enrollmentStatus === 'PENDING') {
            actionHtml = `
              <div class="course-actions">
                <button class="btn btn-pending" disabled>
                  ⏳ Pending Approval
                </button>
                <span class="course-status status-pending">⏳ Pending</span>
              </div>
            `;
          } else {
            actionHtml = `
              <button class="btn btn-enroll enroll-btn" data-course-id="${course.id}" data-title="${course.title}" data-price="${course.price}">
                Enroll Now
              </button>
            `;
          }
        } else if (currentRole === "TUTOR" || currentRole === "ADMIN") {
          actionHtml = `
            <button class="btn manage-btn" data-course-id="${course.id}">
              Manage Course
            </button>
          `;
        }

        // Course image
        const imageHtml = course.imageUrl ? 
          `<img src="${course.imageUrl}" alt="${course.title}" class="course-image" onerror="this.style.display='none'">` : 
          '';

        el.innerHTML = `
          ${imageHtml}
          <h3>${course.title}</h3>
          <p class="course-subject">📚 ${course.subject?.name || "General"}</p>
          <p class="course-tutor">👨‍🏫 ${course.tutor?.user?.email || 'Expert Tutor'}</p>
          <p>${truncateText(course.description || "", 150)}</p>
          <p class="course-price">${formatKES(course.price)}</p>
          ${actionHtml}
        `;

        courseList.appendChild(el);
      }

      // Student enrollment buttons
      courseList.querySelectorAll(".enroll-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          openEnrollModal(
            btn.dataset.courseId,
            btn.dataset.title,
            btn.dataset.price
          );
        });
      });

      // Tutor/Admin management buttons
      courseList.querySelectorAll(".manage-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          window.location.href = `course-details.html?id=${btn.dataset.courseId}`;
        });
      });
    }

    // ================================
    // LOAD CATALOG
    // ================================

    async function loadCatalog() {
      try {
        const result = await Api.getCatalog();
        if (!result || !result.ok) {
          courseList.innerHTML = `<p class="form-error">${(result && result.message) || "Couldn't load courses."}</p>`;
          return;
        }
        await renderCourses(result.data.courses);
      } catch (error) {
        console.error("Error loading courses:", error);
        courseList.innerHTML = `<p class="form-error">An error occurred while loading courses.</p>`;
      }
    }

    // ================================
    // OPEN ENROLLMENT MODAL
    // ================================

    function openEnrollModal(courseId, title, price) {
      if (currentRole !== "STUDENT") {
        console.warn("Enrollment attempted by non-student:", currentRole);
        return;
      }

      activeCourse = courseId;
      activeCourseData = { title, price };

      modalCourseTitle.textContent = "Confirm Enrollment";
      modalCourseName.textContent = title;
      modalCoursePrice.textContent = formatKES(price);
      modalTotalAmount.textContent = formatKES(price);
      
      modalError.hidden = true;
      modalSuccess.hidden = true;
      modalStatus.hidden = false;
      modalStatus.textContent = "Please confirm your enrollment. You will receive payment details via email.";
      modalStatus.className = "modal-status info";

      confirmBtn.disabled = false;
      confirmBtn.textContent = "Confirm Enrollment";

      modal.hidden = false;
    }

    // ================================
    // CLOSE MODAL
    // ================================

    function closeModal() {
      modal.hidden = true;
      activeCourse = null;
      activeCourseData = null;
    }

    cancelBtn.addEventListener("click", closeModal);

    // Close modal when clicking outside
    modal.addEventListener("click", (e) => {
      if (e.target === modal) {
        closeModal();
      }
    });

    // ================================
    // CONFIRM ENROLLMENT
    // ================================

    confirmBtn.addEventListener("click", async () => {
      if (currentRole !== "STUDENT") {
        modalError.textContent = "Only students can enroll in courses.";
        modalError.hidden = false;
        return;
      }

      if (!activeCourse) {
        modalError.textContent = "No course selected.";
        modalError.hidden = false;
        return;
      }

      confirmBtn.disabled = true;
      confirmBtn.textContent = "Processing...";
      modalError.hidden = true;

      try {
        const result = await Api.enrollInCourse(activeCourse);
        
        console.log("Enrollment result:", result);

        if (!result || !result.ok) {
          modalError.textContent = result?.message || "Failed to process enrollment.";
          modalError.hidden = false;
          confirmBtn.disabled = false;
          confirmBtn.textContent = "Confirm Enrollment";
          return;
        }

        // Show success message
        modalStatus.hidden = true;
        modalSuccess.hidden = false;
        modalSuccess.innerHTML = `
          ✅ <strong>Enrollment Request Submitted!</strong><br><br>
          We've sent payment instructions to your email.<br>
          Please check your inbox and follow the instructions to complete payment.<br><br>
          <small>Once payment is confirmed, your enrollment will be activated.</small>
        `;

        confirmBtn.textContent = "Done";
        confirmBtn.disabled = true;

        // Refresh the course list after a delay
        setTimeout(() => {
          closeModal();
          loadCatalog();
        }, 4000);

      } catch (error) {
        console.error("Enrollment error:", error);
        modalError.textContent = error.message || "An error occurred during enrollment.";
        modalError.hidden = false;
        confirmBtn.disabled = false;
        confirmBtn.textContent = "Confirm Enrollment";
      }
    });

    // ================================
    // START LEARNING
    // ================================

    function startLearning(courseId) {
      window.location.href = `learn.html?course=${courseId}`;
    }

    // ================================
    // INIT
    // ================================

    loadCatalog();
  </script>

</body>
</html>
