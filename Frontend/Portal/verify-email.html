<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - EduConnect</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
            text-align: center;
        }

        h1 {
            margin-bottom: 15px;
            color: #1e3a8a;
        }

        #message {
            margin: 20px 0;
            line-height: 1.6;
            color: #555;
        }

        .success {
            color: #198754;
        }

        .error {
            color: #dc3545;
        }

        .loading {
            color: #555;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #1e3a8a;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .button:hover {
            background: #162d6b;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>EduConnect Academy</h1>

    <div id="message" class="loading">
        Verifying your email address...
    </div>

    <a href="login.html" id="loginButton" class="button" style="display:none;">
        Go to Login
    </a>
</div>

<script>
    async function verifyEmail() {
        const message = document.getElementById('message');
        const loginButton = document.getElementById('loginButton');

        // Get token from:
        // verify-email.html?token=XXXXXXXX
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        if (!token) {
            message.className = 'error';
            message.textContent =
                'Verification token is missing. Please use the verification link sent to your email.';
            return;
        }

        try {
            const response = await fetch(
                'http://localhost:5000/api/v1/auth/verify-email',
                {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token: token
                    })
                }
            );

            const data = await response.json();

            if (response.ok) {
                message.className = 'success';
                message.innerHTML = `
                    <strong>Email verified successfully!</strong><br><br>
                    Your EduConnect account is now activated.
                    You can now log in.
                `;

                loginButton.style.display = 'inline-block';
            } else {
                message.className = 'error';
                message.textContent =
                    data.message || 'Email verification failed.';

                if (
                    data.message &&
                    data.message.toLowerCase().includes('already')
                ) {
                    loginButton.style.display = 'inline-block';
                }
            }

        } catch (error) {
            console.error('Verification error:', error);

            message.className = 'error';
            message.innerHTML = `
                Unable to connect to the EduConnect server.
                <br><br>
                Please make sure the backend is running on port 5000.
            `;
        }
    }

    verifyEmail();
</script>

</body>
</html>
