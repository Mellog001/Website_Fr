<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — EduConnect</title>
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

<header>
  <h2>EduConnect</h2>
</header>

<main style="max-width: 420px; margin: 3rem auto; padding: 0 1rem;">

  <h3>Forgot your password?</h3>
  <p>Enter your email address and we'll send you a link to reset your password.</p>

  <p class="form-error" id="formError" hidden></p>
  <p class="form-success" id="formSuccess" hidden></p>

  <form id="forgotForm">
    <div class="input-group">
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="you@example.com" required>
    </div>

    <button type="submit" class="btn" id="submitBtn">Send Reset Link</button>
  </form>

  <p style="margin-top: 1.5rem;">
    <a href="login.html">Back to Login</a>
  </p>

</main>

<script src="js/api.js"></script>
<script>
  const form = document.getElementById("forgotForm");
  const errorEl = document.getElementById("formError");
  const successEl = document.getElementById("formSuccess");
  const submitBtn = document.getElementById("submitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    errorEl.hidden = true;
    successEl.hidden = true;
    submitBtn.disabled = true;
    submitBtn.textContent = "Sending...";

    const email = document.getElementById("email").value.trim();

    try {
      const result = await Api.forgotPassword(email);

      if (!result || !result.ok) {
        errorEl.textContent = (result && result.message) || "Something went wrong. Please try again.";
        errorEl.hidden = false;
        return;
      }

      successEl.textContent = result.message || "If an account exists with that email, a password reset link has been sent.";
      successEl.hidden = false;
      form.reset();

    } catch (error) {
      console.error("Forgot password error:", error);
      errorEl.textContent = "Something went wrong. Please try again.";
      errorEl.hidden = false;
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Send Reset Link";
    }
  });
</script>

</body>
</html>
