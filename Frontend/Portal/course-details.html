<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Details — EduConnect</title>
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
  <header>
    <h2 id="course-title">Loading Course...</h2>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="courses.html">All Courses</a>
      <a href="#" id="logout-btn">Logout</a>
    </nav>
  </header>

  <main style="max-width: 900px; margin: 2rem auto; padding: 0 1rem;">
    <!-- Course Meta Info -->
    <section id="course-info" style="margin-bottom: 2rem; background: #f9f9f9; padding: 1.5rem; border-radius: 8px;">
      <p id="course-description">Loading description...</p>
    </section>

    <!-- Tutor Upload Section -->
    <section id="tutor-actions" style="display: none; margin-bottom: 2rem; background: #eef6ff; padding: 1.5rem; border-radius: 8px;">
      <h3>Add New Module / Upload Notes</h3>
      <form id="add-material-form" style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem;">
        <div>
          <label for="module-title"><b>Module Title:</b></label><br>
          <input type="text" id="module-title" required placeholder="e.g., Chapter 1: Introduction" style="width: 100%; padding: 0.5rem;">
        </div>
        <div>
          <label for="material-file"><b>Notes / Material File:</b></label><br>
          <input type="file" id="material-file" required style="margin-top: 0.5rem;">
        </div>
        <button type="submit" style="padding: 0.7rem; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Upload Material</button>
      </form>
    </section>

    <!-- Student Material Viewing Section -->
    <section>
      <h3>Course Content & Notes</h3>
      <div id="materials-list" style="margin-top: 1rem;">
        <p>Loading course materials...</p>
      </div>
    </section>
  </main>

  <script src="js/api.js"></script>
<script src="js/course-details.js"></script>
</body>
</html>
